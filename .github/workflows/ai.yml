name: Fundus KI-Tipps

on:
  schedule:
    - cron: '13 2 * * *'   # täglich 02:13 UTC = 04:13 Sommerzeit / 03:13 Winterzeit
  workflow_dispatch:
    inputs:
      model:
        description: 'Modell (sonnet, opus, haiku)'
        required: false
        default: 'sonnet'

permissions:
  contents: read

concurrency:
  group: fundus-ai
  cancel-in-progress: false

jobs:
  tips:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MODEL: ${{ github.event.inputs.model || 'sonnet' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abhängigkeiten
        working-directory: ai
        run: |
          npm install --no-audit --no-fund
          npm install -g @anthropic-ai/claude-code --no-audit --no-fund
      - name: Profile aus Firestore lesen
        working-directory: ai
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node export.mjs
      - name: Claude sucht und prüft Tipps
        id: claude
        working-directory: ai
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "$(cat work/index.json)" = "[]" ]; then echo "Keine Konten"; exit 0; fi
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "err=Secret CLAUDE_CODE_OAUTH_TOKEN fehlt" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          claude -p "$(cat PROMPT.md)" --model "$MODEL" --permission-mode dontAsk \
            --allowedTools "Read,Write,Edit,Bash(node verify.mjs *)" \
            --max-turns 60 --output-format json > claude.json
          code=$?
          set -e
          node -e '
            const fs=require("fs");let o={};try{o=JSON.parse(fs.readFileSync("claude.json","utf8"))}catch(e){}
            console.log("Exit:",process.argv[1],"| Fehler:",!!o.is_error,"| Runden:",o.num_turns,"| Ergebnis:",String(o.result||"").slice(0,300));
            let err="";
            if(o.is_error||process.argv[1]!=="0"){const r=String(o.result||o.subtype||"");
              err=/auth|login|token|401|403|credential/i.test(r)?"Anmeldung bei Claude fehlgeschlagen – Token mit claude setup-token erneuern":/limit|usage|quota|429/i.test(r)?"Abo-Limit erreicht, nächster Versuch morgen":"KI-Lauf abgebrochen: "+r.slice(0,120)}
            if(err)fs.appendFileSync(process.env.GITHUB_OUTPUT,"err="+err.replace(/\n/g," ")+"\n");
          ' "$code"
      - name: Tipps prüfen und speichern
        working-directory: ai
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          AI_ERROR: ${{ steps.claude.outputs.err }}
          AI_MODEL: ${{ env.MODEL }}
        run: node import.mjs

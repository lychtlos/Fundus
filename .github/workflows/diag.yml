name: Fundus Diagnose
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: ai
        run: npm install --no-audit --no-fund
      - working-directory: ai
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
        run: node diag.mjs

name: Fundus TV bauen

on:
  push:
    branches: [main]
    paths: ['tv/**', '.github/workflows/tv.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundus-tv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: APK bauen
        working-directory: tv
        env:
          FUNDUS_TV_CLIENT_ID: ${{ secrets.FUNDUS_TV_CLIENT_ID }}
          FUNDUS_TV_CLIENT_SECRET: ${{ secrets.FUNDUS_TV_CLIENT_SECRET }}
        run: gradle --no-daemon assembleRelease
      - name: Als Release „tv-latest“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tv/app/build/outputs/apk/release/app-release.apk fundus-tv.apk
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest fundus-tv.apk \
            --title "Fundus TV (Build ${{ github.run_number }})" \
            --notes "Installation auf Google TV: https://github.com/${{ github.repository }}/releases/download/tv-latest/fundus-tv.apk" \
            --prerelease

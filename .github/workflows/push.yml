name: Fundus täglicher Check

on:
  schedule:
    - cron: '7 6 * * *'   # täglich 06:07 UTC = 08:07 Sommerzeit / 07:07 Winterzeit
  push:                    # Änderung am Prüfskript = Testlauf ohne Versand
    branches: [main]
    paths: ['push/**', '.github/workflows/push.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Testlauf ohne Versand (1 = ja)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abhängigkeiten
        working-directory: push
        run: npm install --no-audit --no-fund
      - name: Neuerscheinungen prüfen und senden
        working-directory: push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_PUBLIC: BPbXST0UBvG6REMA1frrvW3xPKhxm8r5XFh-T9igYiEcuAnLQ7wI8NXYET8YRMFgVbx-RCIL_LgL5L04tSw43fI
          DRY_RUN: ${{ github.event_name == 'push' && '1' || github.event.inputs.dry_run || '0' }}
        run: node check.mjs
      # GitHub schaltet Zeitpläne nach 60 Tagen ohne Commit ab – alle 50 Tage ein leerer Commit
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50*86400 )) ]; then
            git config user.name "fundus-bot"; git config user.email "fundus-bot@users.noreply.github.com"
            git commit --allow-empty -m "Zeitplan aktiv halten" && git push
          fi

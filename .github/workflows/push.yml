name: Fundus täglicher Check

on:
  schedule:
    - cron: '37 4 * * *'  # täglich 04:37 UTC = 06:37 Sommerzeit / 05:37 Winterzeit (GitHub startet oft verspätet)
  workflow_run:            # zusätzlich direkt nach dem nächtlichen KI-Lauf (Konzerte, Radar, Digest-Text sind dann frisch)
    workflows: ['Fundus KI-Tipps']
    types: [completed]
  push:                    # Änderung am Prüfskript = Testlauf ohne Versand
    branches: [main]
    paths: ['push/**', '.github/workflows/push.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Testlauf ohne Versand (1 = ja)'
        required: false
        default: '0'
      force_digest:
        description: 'Wochen-Digest auch heute senden (1 = ja)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: fundus-push
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Abhängigkeiten
        working-directory: push
        run: npm install --no-audit --no-fund
      - name: Neuerscheinungen prüfen und senden
        working-directory: push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          TM_KEY: ${{ secrets.TM_KEY }}
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
          VAPID_PUBLIC: BPbXST0UBvG6REMA1frrvW3xPKhxm8r5XFh-T9igYiEcuAnLQ7wI8NXYET8YRMFgVbx-RCIL_LgL5L04tSw43fI
          FORCE_DIGEST: ${{ github.event.inputs.force_digest || '0' }}
          DRY_RUN: ${{ github.event_name == 'push' && '1' || github.event.inputs.dry_run || '0' }}
        run: node check.mjs
      # GitHub schaltet Zeitpläne nach 60 Tagen ohne Commit ab – alle 50 Tage ein leerer Commit
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50*86400 )) ]; then
            git config user.name "fundus-bot"; git config user.email "fundus-bot@users.noreply.github.com"
            git commit --allow-empty -m "Zeitplan aktiv halten" && git push
          fi

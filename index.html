<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0D6A5B"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fundus"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body>

<style>
/* Layout: App-Shell mit fester Kopfleiste; Inhalte als Karteikarten (Cover links, Text rechts) im 1–3-Spalten-Raster */
:root{
  --bg:#EBEFED; --surface:#FAFBFA; --surface-2:#DFE6E2; --ink:#14201B; --ink-2:#4B5A54; --line:#C9D3CE;

  --shade:rgba(20,32,27,.45);
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; /* Kleinlabels und Zahlen: gleiche Schrift, Ziffern tabellarisch */
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201C; --surface-2:#1F2B27; --ink:#E4EBE8; --ink-2:#A1B0AA; --line:#2C3A35;
  --accent:#4EC1A7; --accent-ink:#05201A; --mark:#E6AE45; --good:#5BC583; --bad:#EE7B6C;
  --c-film:#7F9CE0; --c-serie:#B98ADB; --c-musik:#E58A74; --c-buch:#D2AE4E; --c-podcast:#5CC4CC; --c-game:#9BCB5E;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-2:#1F2B27; --ink:#E4EBE8; --ink-2:#A1B0AA; --line:#2C3A35;
  --accent:#4EC1A7; --accent-ink:#05201A; --mark:#E6AE45; --good:#5BC583; --bad:#EE7B6C;
  --c-film:#7F9CE0; --c-serie:#B98ADB; --c-musik:#E58A74; --c-buch:#D2AE4E; --c-podcast:#5CC4CC; --c-game:#9BCB5E;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
/* App-eigene Wahl (Hell/Dunkel) hat Vorrang vor System und Viewer */
html:root[data-ft="light"]{
  --bg:#EBEFED; --surface:#FAFBFA; --surface-2:#DFE6E2; --ink:#14201B; --ink-2:#4B5A54; --line:#C9D3CE;
  --accent:#0D6A5B; --accent-ink:#FFFFFF; --mark:#B7790B; --good:#1E7440; --bad:#A8372B;
  --c-film:#3B5DA6; --c-serie:#7D4E9E; --c-musik:#B3432F; --c-buch:#8C6A10; --c-podcast:#19808A; --c-game:#4F7A1F;
  --shade:rgba(20,32,27,.45);
  color-scheme:light}
html:root[data-ft="dark"]{
  --bg:#0E1412; --surface:#16201C; --surface-2:#1F2B27; --ink:#E4EBE8; --ink-2:#A1B0AA; --line:#2C3A35;
  --accent:#4EC1A7; --accent-ink:#05201A; --mark:#E6AE45; --good:#5BC583; --bad:#EE7B6C;
  --c-film:#7F9CE0; --c-serie:#B98ADB; --c-musik:#E58A74; --c-buch:#D2AE4E; --c-podcast:#5CC4CC; --c-game:#9BCB5E;
  --shade:rgba(0,0,0,.6);
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%;overscroll-behavior-x:none}
body{touch-action:manipulation;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 24px;padding-top:12px}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:8px;margin-right:auto}
.burger{border:0;background:none;width:40px;height:40px;margin-left:-8px;border-radius:10px;display:grid;place-items:center;color:var(--ink);cursor:pointer}

.burger svg{width:24px;height:24px}
.h-ic{display:inline-grid;vertical-align:-3px;margin-right:8px;color:var(--mc)}
.h-ic svg{width:24px;height:24px}
.drawer{position:fixed;inset:0;z-index:22;background:transparent;transition:background .2s}
.drawer.open{background:var(--shade)}
.dr-panel{position:absolute;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--bg);display:flex;flex-direction:column;overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 14px) max(10px,env(safe-area-inset-left,0px));
  transform:translateX(-100%);transition:transform .2s ease-out;box-shadow:4px 0 24px rgba(0,0,0,.25)}
.drawer.open .dr-panel{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px}
.dr-brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.03em}
.dr-brand i{font-style:normal;color:var(--accent)}
.dr-sec{display:flex;flex-direction:column;gap:2px}
.dr-cap{padding:6px 12px 6px}
.dr-bottom{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.dr-i{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;font-weight:600;font-size:15px;color:var(--ink);flex-wrap:wrap}
.dr-i:hover{background:var(--surface-2)}
.dr-i:focus-visible{outline:2px solid var(--accent)}
.dr-i.on{background:color-mix(in oklab,var(--accent) 14%,transparent);color:var(--accent)}
.dr-ic{width:24px;height:24px;display:grid;place-items:center;flex:none}
.dr-ic svg{width:22px;height:22px}
.dr-ic .tab-av{width:26px;height:26px}
.dr-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-n{font-size:12px;color:var(--ink-2);font-weight:500}
.dr-sub{flex-basis:100%;padding-left:38px;margin-top:-4px;font-size:12px;color:var(--ink-2);font-weight:500}
@media (prefers-reduced-motion:reduce){.dr-panel,.drawer{transition:none}}
.brand h1{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
.brand h1 i{font-style:normal;color:var(--accent)}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.topr{display:flex;align-items:center;gap:8px;margin-bottom:8px;order:2}
@media (min-width:900px){.topr{margin-left:auto}}
.topr .theme{margin-bottom:0}
.acct{border:0;padding:0;background:none;position:relative;width:32px;height:32px;border-radius:50%;cursor:pointer}
.acct img,.acct span{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;object-fit:cover}
.acct .sd{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg)}
.sd-ok{background:var(--good)} .sd-busy{background:var(--mark)} .sd-err{background:var(--bad)}
.acct-in{padding:5px 10px}
#acct{display:flex;gap:8px;align-items:center}
@media (max-width:480px){.acct-in span{display:none}}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px;margin-bottom:8px;order:2}
.theme button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:5px;align-items:center}

.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0;order:3}
.tabs::-webkit-scrollbar{display:none}
@media (min-width:900px){.tabs{flex:0 1 auto;order:1}.brand{margin-right:0}.theme{margin-left:auto}}
.tab{background:none;border:0;padding:10px 12px 12px;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab-ic{position:relative;display:inline-grid;place-items:center}
.tab-ic svg{width:17px;height:17px}
.tab-av{width:20px;height:20px;border-radius:50%;object-fit:cover}
.tab-s,.cnt2{display:none}
.tab .count{position:absolute;top:-7px;right:-12px;font-size:10px;line-height:15px;padding:0 5px}
.tab-l{margin-left:2px}
/* Handy: Menü als Leiste am unteren Rand */
@media (max-width:899px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;transform:translateZ(0);display:grid;grid-template-columns:repeat(4,1fr);gap:0;overflow:visible;background:var(--bg);border-top:1px solid var(--line);
    padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
  .tab{flex-direction:column;gap:3px;padding:6px 2px 4px;border-bottom:0;font-size:11.5px;font-weight:600;min-width:0}

  .tab-av{width:26px;height:26px}

  .topr{margin-bottom:0}
}
.tab:hover{color:var(--ink)}
.count{font-family:var(--f-mono);font-size:11px;background:var(--mark);color:var(--surface);border-radius:999px;padding:0 6px;line-height:18px}
.st{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}

.banner{margin:16px 0 0;padding:10px 14px;border-radius:var(--r);background:var(--surface-2);font-size:13.5px;color:var(--ink-2);display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--ink)}
.banner .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--mark);margin-top:6px}

.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin:28px 0 14px}
.head h2{font-size:24px;font-weight:700;letter-spacing:-.01em;margin-right:auto;line-height:1.3;padding-top:2px}
.lead{color:var(--ink-2);margin:-6px 0 16px;max-width:65ch}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.wrapchips{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px;flex:none}

.switch{display:inline-flex;gap:8px;align-items:center;font-size:13.5px;font-weight:500;cursor:pointer}
.switch input{width:34px;height:20px;appearance:none;background:var(--line);border-radius:999px;position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
.switch input:disabled{opacity:.5}

/* Karten */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:12px}
.card{display:grid;grid-template-columns:92px 1fr;gap:14px;background:var(--surface);border-radius:var(--r);padding:12px;min-width:0;transition:opacity .2s,transform .2s}
.card.gone{opacity:0;transform:scale(.97)}
.art{width:92px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--surface-2);align-self:start;max-width:100%}
.art.sq{aspect-ratio:1/1}
.art img,.art svg{width:100%;height:100%;object-fit:cover;display:block}
.body{min-width:0;display:flex;flex-direction:column;gap:3px}
.meta{display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;flex-wrap:wrap}
.mtag{display:inline-flex;align-items:center;gap:5px;color:var(--mc)}
.mtag::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--mc)}
.t{font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.sub{margin:0;color:var(--ink-2);font-size:13.5px;overflow-wrap:anywhere}
.why{margin:2px 0 0;font-size:13px;color:var(--ink)}

.av{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:6px;padding:2px 8px;margin-top:4px;align-self:flex-start;max-width:100%}
.av img{width:16px;height:16px;border-radius:3px}
.av-yes{background:color-mix(in oklab,var(--good) 16%,transparent);color:var(--good)}
.av-other{background:var(--surface-2);color:var(--ink-2)}
.av-none,.av-wait{color:var(--ink-2);padding-inline:0;font-weight:500}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:8px}
.acts .btn{padding:5px 9px;font-size:13px}
.acts .lnk{margin-left:auto}
.f-film{--mc:var(--c-film)} .f-serie{--mc:var(--c-serie)} .f-musik{--mc:var(--c-musik)} .f-buch{--mc:var(--c-buch)} .f-podcast{--mc:var(--c-podcast)} .f-game{--mc:var(--c-game)}

.sec + .sec{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.sec-h h3{font-size:18px;display:flex;gap:8px;align-items:center}
.sec-h h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--mc)}
.sec-h .btn{margin-left:auto}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.empty p{margin:0;color:var(--ink-2);max-width:60ch;flex:1 1 260px}
.skel{background:var(--surface);border-radius:var(--r);height:160px;position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,color-mix(in oklab,var(--surface-2) 70%,transparent),transparent);animation:sh 1.2s infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.more{display:flex;justify-content:center;margin-top:16px}
.err{color:var(--bad);font-size:13.5px}
.note{font-size:13px;color:var(--ink-2);max-width:70ch}

.base{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:4px 4px 4px 12px;font-size:13.5px;max-width:100%}
.pill span,.pill .tbtn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill button{border:0;background:var(--surface-2);border-radius:50%;width:22px;height:22px;display:grid;place-items:center;flex:none;color:var(--ink-2);padding:0}
.pill button svg{width:12px;height:12px}
.pill.neg{background:none;border:1px solid var(--line);color:var(--ink-2)}
details.rated{margin-top:10px}
details.rated summary{cursor:pointer;color:var(--ink-2);font-size:13.5px}
details.rated .base{margin-top:8px}

.rel{display:flex;flex-direction:column;gap:6px}
.ev .ev-art{align-self:center}.ev .t .tbtn{font:inherit;color:inherit;text-align:left;padding:0;border:0;background:none;cursor:pointer;overflow-wrap:anywhere}
.ev.is-fol{box-shadow:inset 0 0 0 2px var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}.fol-tag{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:700}.fol-tag svg{width:12px;height:12px}.fol-key{display:inline-block;width:12px;height:12px;border-radius:3px;box-shadow:inset 0 0 0 2px var(--accent);vertical-align:-1px}
.follow-box{border:2px solid var(--accent);border-radius:calc(var(--r) + 6px);padding:12px;margin:6px 0 18px;background:color-mix(in srgb,var(--accent) 6%,transparent)}.follow-box .subh{margin-top:0;color:var(--accent);display:flex;align-items:center;gap:6px}.follow-box .subh svg{width:18px;height:18px}.follow-box .rel{gap:8px}.fol-none{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ev{display:grid;grid-template-columns:48px 70px 1fr auto;gap:14px;align-items:center;background:var(--surface);border-radius:var(--r);padding:10px 14px}

.set{display:grid;gap:14px;max-width:820px}
.panel{background:var(--surface);border-radius:var(--r);padding:18px}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

function wrapTitle(t,max,lines){
  const words=String(t).split(/\s+/);const out=[];let cur='';
  for(const w of words){if(!cur)cur=w;else if((cur+' '+w).length<=max)cur+=' '+w;else{out.push(cur);cur=w}}
  if(cur)out.push(cur);
  if(out.length>lines){const keep=out.slice(0,lines);keep[lines-1]=keep[lines-1].replace(/\s*\S*$/,'')+' …';return keep}
  return out;
}
function motif(m,W,H){
  const s='rgba(255,255,255,.16)';
  if(m==='film')return '<g stroke="'+s+'" stroke-width="12">'+[0,1,2,3,4,5,6].map(i=>'<line x1="'+(-120+i*55)+'" y1="0" x2="'+(-20+i*55)+'" y2="'+H+'"/>').join('')+'</g><g fill="rgba(0,0,0,.22)">'+Array.from({length:Math.ceil(H/26)},(_,i)=>'<rect x="6" y="'+(8+i*26)+'" width="10" height="14" rx="2"/><rect x="'+(W-16)+'" y="'+(8+i*26)+'" width="10" height="14" rx="2"/>').join('')+'</g>';
  if(m==='serie')return '<g fill="'+s+'">'+Array.from({length:12},(_,i)=>'<rect x="'+(22+(i%3)*56)+'" y="'+(24+Math.floor(i/3)*44)+'" width="44" height="32" rx="4"/>').join('')+'</g>';
  if(m==='musik')return '<g fill="none" stroke="'+s+'" stroke-width="5">'+[86,70,54,38].map(r=>'<circle cx="'+(W*0.62)+'" cy="'+(H*0.38)+'" r="'+r+'"/>').join('')+'</g><circle cx="'+(W*0.62)+'" cy="'+(H*0.38)+'" r="12" fill="'+s+'"/>';
  if(m==='game')return '<g fill="none" stroke="'+s+'" stroke-width="6" stroke-linecap="round"><rect x="40" y="60" width="120" height="70" rx="32"/><path d="M72 85v20M62 95h20"/></g><g fill="'+s+'"><circle cx="128" cy="88" r="6"/><circle cx="142" cy="102" r="6"/></g>';
  if(m==='buch')return '<rect x="0" y="0" width="22" height="'+H+'" fill="rgba(0,0,0,.2)"/><g stroke="'+s+'" stroke-width="3">'+[40,52,64].map(y=>'<line x1="40" y1="'+y+'" x2="'+(W-24)+'" y2="'+y+'"/>').join('')+'</g>';
  return '<g fill="none" stroke="'+s+'" stroke-width="5" stroke-linecap="round">'+[0,1,2,3].map(i=>{const y=40+i*24;return '<path d="M20 '+y+' Q 55 '+(y-22)+' 90 '+y+' T 160 '+y+' T 230 '+y+'"/>'}).join('')+'</g>';
}
function genArt(it,bare){
  const sq=MEDIA[it.m].sq;const W=200,H=sq?200:300;
  const h=hash(it.k+'|'+it.title);const hue=h%360;const hue2=(hue+30+((h>>4)%70))%360;
  const lines=wrapTitle(it.title,sq?14:12,sq?3:4);
  const longest=Math.max(...lines.map(l=>l.length),4);
  const fs=Math.max(15,Math.min(sq?30:34,Math.floor(172/(longest*0.56))));
  const y0=H-18-(lines.length-1)*fs*1.06;
  const gid='g'+h;
  const label=(MEDIA[it.m].one+(it.year?' · '+it.year:'')).toUpperCase();
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl('+hue+' 52% 40%)"/><stop offset="1" stop-color="hsl('+hue2+' 58% 20%)"/></linearGradient></defs>'+
    '<rect width="'+W+'" height="'+H+'" fill="url(#'+gid+')"/>'+motif(it.m,W,H)+(bare?'</svg>':'')+
    (bare?'':'<text x="'+(it.m==='buch'?34:16)+'" y="'+(it.m==='film'?32:26)+'" font-family="Figtree,sans-serif" font-weight="600" font-size="11" letter-spacing="1.5" fill="rgba(255,255,255,.75)">'+esc(label)+'</text>'+
    '<text font-family="Archivo,Segoe UI,sans-serif" font-weight="800" font-size="'+fs+'" fill="#fff" letter-spacing="-0.5">'+
    lines.map((l,i)=>'<tspan x="'+(it.m==='buch'?34:16)+'" y="'+(y0+i*fs*1.06).toFixed(1)+'">'+esc(l)+'</tspan>').join('')+'</text></svg>');
}

/* ---------- Netz: Zwischenspeicher, Drosselung, Ausweichquellen ----------
   Speicher: im Arbeitsspeicher und (ab 1 h Gültigkeit) dauerhaft im Browser.
   Drosselung je Dienst unter den bekannten Limits. Fällt eine Quelle aus
   oder liefert nichts, springt die nächste Quelle ein. */
const H=36e5;
const RC=new Map();
function pget(k,ttl){try{const v=localStorage.getItem('fc:'+k);if(!v)return undefined;const o=JSON.parse(v);if(Date.now()-o.t<ttl)return o.d}catch(e){}return undefined}
function pset(k,d){const s=JSON.stringify({t:Date.now(),d});
  try{localStorage.setItem('fc:'+k,s)}catch(e){try{const ks=[];for(let i=0;i<localStorage.length;i++){const x=localStorage.key(i);if(x&&x.startsWith('fc:'))ks.push([x,(()=>{try{return JSON.parse(localStorage.getItem(x)).t}catch(_){return 0}})()])}
    ks.sort((a,b)=>a[1]-b[1]).slice(0,Math.ceil(ks.length/2)).forEach(x=>localStorage.removeItem(x[0]));localStorage.setItem('fc:'+k,s)}catch(e2){}}}
function cached(key,fn,ttl=6e5){
  const c=RC.get(key);if(c&&Date.now()-c.t<ttl)return c.p;
  if(ttl>=H){const v=pget(key,ttl);if(v!==undefined){const p=Promise.resolve(v);RC.set(key,{t:Date.now(),p});return p}}
  const pr=fn().then(d=>{if(ttl>=H)pset(key,d);return d}).catch(e=>{RC.delete(key);throw e});
  RC.set(key,{t:Date.now(),p:pr});return pr;
}
function limiter(max,win){const ts=[];return async function(){for(;;){const now=Date.now();while(ts.length&&now-ts[0]>win)ts.shift();if(ts.length<max){ts.push(now);return}await new Promise(r=>setTimeout(r,win-(now-ts[0])+30))}}}
const GATE={tmdb:limiter(35,1000),dz:limiter(40,5000),it:limiter(18,60000),ol:limiter(60,60000),gb:limiter(60,60000),tvm:limiter(18,10000),fy:limiter(30,60000)};
/* erste Quelle, die etwas liefert; Fehler nur, wenn alle scheitern */
async function chain(...fns){let err=null;for(const f of fns){try{const r=await f();if(r&&(!Array.isArray(r)||r.length))return r}catch(e){err=err||e}}if(err)throw err;return []}
/* fetch mit Zeitlimit: hängende Verbindungen (z. B. mobil) brechen nach 15 s ab */
function fetchT(url,opts={},ms=15000){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{...opts,signal:c.signal}).catch(e=>{throw e.name==='AbortError'?new Error('Zeitüberschreitung'):e}).finally(()=>clearTimeout(t))}
async function getJSON(url,gate,name){await gate();const r=await fetchT(url);if(r.status===429)throw new Error(name+': zu viele Anfragen, bitte kurz warten');if(!r.ok)throw new Error(name+' antwortet mit Fehler '+r.status);return r.json()}
let jpN=0;
function jsonp(url,param='callback'){return new Promise((res,rej)=>{
  const cb='__fundus'+(++jpN);const s=document.createElement('script');
  const t=setTimeout(()=>{clean();rej(new Error('Zeitüberschreitung'))},12000);
  function clean(){clearTimeout(t);try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}
  window[cb]=d=>{clean();res(d)};s.onerror=()=>{clean();rej(new Error('Laden fehlgeschlagen'))};
  s.src=url+(url.includes('?')?'&':'?')+param+'='+cb;document.head.appendChild(s);
})}

async function tmdb(path,params={}){
  const key=tmdbKeyNow();
  const u=new URL('https://api.themoviedb.org/3'+path);
  if(!('language' in params))params.language='de-DE';
  Object.entries(params).forEach(([k,v])=>{if(v!==undefined&&v!=='')u.searchParams.set(k,v)});
  const h={accept:'application/json'};
  if(key.length>40)h.Authorization='Bearer '+key;else u.searchParams.set('api_key',key);
  const ttl=/^\/tv\/\d+$/.test(path)?6*H:/watch\/providers$/.test(path)?12*H:/^\/(search|configuration)/.test(path)?6e5:24*H;
  return cached(u.toString(),async()=>{
    await GATE.tmdb();
    const r=await fetchT(u,{headers:h});

/* Genre-Schärfung: TMDB vergibt Genres großzügig (Forrest Gump = Komödie, Drama, Romanze).
   Für die Genre-Listen werden Mischformen ausgeschlossen, die nicht zum Genre passen. */
const GENRE_EXCL={
  movie:{35:[18,80,10752,36,16,10751]},                       // Komödie: keine Dramen, Krimis, Kriegs-/Historienfilme, Animation, Familie
  tv:{35:[18,80,16,10751,10762]}                               // Comedy-Serien: dito, keine Kinderserien
};
const TV_NOISE=[10767,10763,10764,10766];                      // Talk, News, Reality, Soap
function genreExcl(type,gid){gid=+gid;let ex=(GENRE_EXCL[type]||{})[gid]||[];if(type==='tv'&&!TV_NOISE.includes(gid))ex=ex.concat(TV_NOISE);if(gid!==16&&!ex.includes(16))ex=ex.concat([16]); /* Animation nur unter Animation */return ex}
function tmdbAdapter(m){
  const type=m==='film'?'movie':'tv';
  const minVotes=m==='film'?400:150;
  const tvOnly=s=>m==='serie'&&String(s.id).startsWith('tvm');
  return {
    async genres(){return (await tmdbGenres(type)).map(g=>({id:g.id,name:g.name}))},
    async byGenre(gid,page=1){if(page>10)return [];await tmdbGenres(type);const d=await tmdb('/discover/'+type,{with_genres:gid,without_genres:genreExcl(type,gid).join(',')||undefined,sort_by:'popularity.desc','vote_count.gte':minVotes,page});return (d.results||[]).map(r=>tmdbItem(m,r))},
    async search(q){return chain(
      async()=>{await tmdbGenres(type);const d=await tmdb('/search/'+type,{query:q});return (d.results||[]).map(r=>tmdbItem(m,r))},
      async()=>m==='serie'?(await tvmaze('/search/shows?q='+encodeURIComponent(q),6e5)).map(x=>tvmItem(x.show)):[])},
    async similar(s){if(tvOnly(s))return [];await tmdbGenres(type);const d=await tmdb('/'+type+'/'+s.id+'/recommendations');return (d.results||[]).map(r=>({it:tmdbItem(m,r),w:1}))},
    async explore(base){
      await tmdbGenres(type);const cnt={};base.forEach(b=>(b.gids||[]).forEach(g=>cnt[g]=(cnt[g]||0)+1));
      (S.genres[m]||[]).forEach(g=>cnt[g]=(cnt[g]||0)+1);
      const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>+e[0]);if(!top.length)return [];
      const g=top[Math.floor(Math.random()*top.length)];
      const rr=rules(m);const ex=genreExcl(type,g).concat(rr.exGid);
      const d=await tmdb('/discover/'+type,{with_genres:g,without_genres:ex.join(',')||undefined,sort_by:'popularity.desc','vote_count.gte':Math.round(minVotes/2),page:1+Math.floor(Math.random()*3),...provParams(),
        [m==='film'?'primary_release_date.gte':'first_air_date.gte']:rr.minYear?rr.minYear+'-01-01':undefined,'vote_average.gte':rr.minR||undefined});
      return (d.results||[]).map(r=>({it:tmdbItem(m,r),w:1,why:'Entdecken · '+gName(type,g)}));
    },
    async avail(it){if(tvOnly(it))return null;return parseAv(await tmdb('/'+type+'/'+it.id+'/watch/providers',{language:''}))},
    async releases(it){
      if(m==='film'){const [a,b]=await Promise.all([filmAvEvents(it),filmDateEvents(it).catch(()=>[])]);return a.concat(b)}
      if(tvOnly(it))return tvmazeEvents(it);
      let d;try{d=await tmdb('/tv/'+it.id)}catch(e){return tvmazeEvents(it)}
      const ev=[];const nx=d.next_episode_to_air,ls=d.last_episode_to_air;
      if(nx&&nx.air_date)ev.push({id:it.k+':'+epCode(nx.season_number,nx.episode_number),date:nx.air_date,label:nx.episode_number===1?'Neue Staffel startet':'Nächste Folge',text:epCode(nx.season_number,nx.episode_number)+(nx.name?' · '+nx.name:'')});
      if(ls&&ls.air_date&&dayDiff(ls.air_date)>=-45)ev.push({id:it.k+':'+epCode(ls.season_number,ls.episode_number),date:ls.air_date,label:ls.episode_number===1?'Neue Staffel gestartet':'Neue Folge erschienen',text:epCode(ls.season_number,ls.episode_number)+(ls.name?' · '+ls.name:'')});
      /* TMDB kennt den nächsten Termin oft spät: bei laufenden Serien TVmaze fragen */
      if(!nx&&/Returning|Production|Planned/i.test(d.status||'')){try{(await tvmazeEvents(it)).filter(e=>dayDiff(e.date)>0).forEach(e=>ev.push(e))}catch(e){}}
      if(S.items[it.k]){const old=S.items[it.k].seasons;if(old&&d.number_of_seasons>old)ev.push({id:it.k+':season'+d.number_of_seasons,date:today(),label:'Neue Staffel eingetragen',text:'Staffel '+d.number_of_seasons});S.items[it.k].seasons=d.number_of_seasons}
      return ev;
    }
  };
}

const REL_T={3:'Kinostart',4:'Digital erhältlich',5:'Auf DVD & Blu-ray'};
async function movieDatesDE(id){
  const d=await tmdb('/movie/'+id+'/release_dates',{language:''});
  const de=(d.results||[]).find(r=>r.iso_3166_1==='DE');const out={};
  (de&&de.release_dates||[]).forEach(r=>{const t=r.type===2?3:r.type;if(!REL_T[t])return;const dt=String(r.release_date).slice(0,10);if(!out[t]||dt<out[t])out[t]=dt});

}
async function filmDateEvents(it){

    .map(([t,dt])=>({id:it.k+':rel'+t+':'+dt,date:dt,label:REL_T[t],text:t==='3'?'Im Kino in Deutschland':t==='4'?'Zum Kaufen oder Leihen':'Erscheint auf Disc'}));

const tm=(path,params,ttl=12*H)=>{const k=tmKey();if(!k)return Promise.reject(new Error('Ticketmaster-Schlüssel fehlt'));
  const u=new URL('https://app.ticketmaster.com/discovery/v2'+path);Object.entries(params).forEach(([a,b])=>{if(b!==undefined&&b!=='')u.searchParams.set(a,b)});u.searchParams.set('apikey',k);
  return cached('tm'+u.pathname+u.search.replace(/&?apikey=[^&]*/,''),()=>getJSON(u.toString(),GATE_TM,'Ticketmaster'),ttl)};
async function geoPlz(plz){return cached('plz'+plz,async()=>{const d=await getJSON('https://api.zippopotam.us/de/'+encodeURIComponent(plz),async()=>{},'PLZ-Suche');const p=(d.places||[])[0];if(!p)throw new Error('PLZ nicht gefunden');return {lat:+p.latitude,lon:+p.longitude,ort:p['place name']}},90*24*H)}
function geohash(lat,lon,prec=6){const B='0123456789bcdefghjkmnpqrstuvwxyz';let la=[-90,90],lo=[-180,180],h='',bit=0,ch=0,even=true;
  while(h.length<prec){const r=even?lo:la,v=even?lon:lat,mid=(r[0]+r[1])/2;if(v>mid){ch|=16>>bit;r[0]=mid}else r[1]=mid;even=!even;if(bit<4)bit++;else{h+=B[ch];bit=0;ch=0}}return h}
const kmDist=(a,b)=>{const R=6371,t=x=>x*Math.PI/180;const dl=t(b.lat-a.lat),dn=t(b.lon-a.lon);const x=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return Math.round(2*R*Math.asin(Math.sqrt(x)))};

const baseName=n=>String(n).replace(/\s+(Amazon|Apple TV|Apple TV Plus|Prime Video|Roku Premium)?\s*Channels?$/i,'').replace(/\s+(Standard|Basic)?\s*with Ads$/i,'').replace(/\s+mit Werbung$/i,'').replace(/\s+Free$/i,'').replace(/\+$/,' Plus').trim();
async function availFetch(it){if(AV.has(it.k))return AV.get(it.k);const A=adapter(it.m);if(!A||!A.avail)return null;let av=null;try{av=await A.avail(it)}catch(e){av=null}AV.set(it.k,av);return av}
function avSum(it){
  const av=AV.get(it.k);if(!av)return null;const mine=new Set(S.settings.providers);
  const seen=new Set();const hits=[];
  av.flat.filter(p=>mine.has(p.id)).forEach(p=>{const b=baseName(p.name);if(!seen.has(b)){seen.add(b);hits.push(p)}});
  if(S.settings.includeFree)av.free.forEach(p=>{const b=baseName(p.name);if(!seen.has(b)){seen.add(b);hits.push({...p,free:true})}});
  const others=[];av.flat.filter(p=>!mine.has(p.id)).forEach(p=>{const b=baseName(p.name);if(!seen.has(b)){seen.add(b);others.push(p)}});
  return {hits,others,rent:av.rent.length>0,link:av.link};
}
const provNames=list=>{const n=[...new Set(list.map(p=>baseName(p.name)))];return n.slice(0,2).join(', ')+(n.length>2?' +'+(n.length-2):'')};
function avHtml(it){

}

/* ---------- Regeln für Vorschläge (je Bereich, in den Einstellungen) ----------
   minYear: frühestes Erscheinungsjahr · minR: Mindestbewertung (0–10) · exG: ausgeschlossene Genres (Namen), exGid: TMDB-IDs */
const RULE_M=['film','serie','buch','game'];
const rules=m=>({minYear:0,minR:0,exG:[],exGid:[],...((S.settings.rules||{})[m]||{})});
function passRules(m,it){
  if(!RULE_M.includes(m))return true;const r=rules(m);
  if(r.minYear){const y=parseInt(it.year);if(y&&y<r.minYear)return false}
  if(r.minR&&hasRating(it)&&it.rating<r.minR)return false;
  if(r.exG.length&&(it.genres||[]).some(g=>r.exG.includes(g)))return false;
  if(r.exGid.length&&(it.gids||[]).some(g=>r.exGid.includes(g)))return false;
  return true;
}
const rulesActive=m=>{const r=rules(m);return !!(r.minYear||r.minR||r.exG.length)};
/* ---------- Vorschlags-Logik ---------- */
async function buildPool(m){
  const A=adapter(m);if(!A)return [];
  const loves=byExact(m,'love'),likesOnly=byExact(m,'like'),likes=byStatus(m,'like'),watch=byStatus(m,'watch'),dis=byStatus(m,'dislike');
  if(!likes.length&&!watch.length)return [];
  /* alle „Gefällt mir“ (neueste zuerst, Obergrenze je Bereich wegen API-Limits);
     Gewicht 1,0 für den neuesten Eintrag, linear fallend bis 0,5 für den ältesten */
  const CAP={film:40,serie:40,musik:40,buch:12,podcast:20}[m]||30;
  /* Lieblingstitel (♥) zählen doppelt und sind immer dabei */
  const lv=loves.slice(0,Math.min(20,CAP)),lk=likesOnly.slice(0,Math.max(0,CAP-lv.length)),n=lk.length;
  const seeds=lv.map(s=>[s,2,false,true]).concat(lk.map((s,i)=>[s,n>1?1-0.5*i/(n-1):1,false])).concat(watch.slice(0,10).map(s=>[s,0.4,true]));
  const cand=new Map();const known=new Set(Object.values(S.items).map(x=>x.tk).filter(Boolean));
  const add=(it,w,why,ex)=>{if(!it||S.items[it.k]||(it.tk&&known.has(it.tk)))return;const key=it.tk||it.k;let c=cand.get(key);
    if(!c){c={it,score:0,reasons:[],ex:!!ex};cand.set(key,c)}else if(!ex)c.ex=false;
    c.score+=w;if(why&&w>0&&c.reasons.length<2&&!c.reasons.includes(why))c.reasons.push(why)};
  await pool(seeds,4,async([s,w,wl,lov])=>{(await A.similar(s)).forEach((r,i)=>add(r.it,w*r.w*(1-i/60),r.why||(wl?'Ähnlich wie „'+s.title+'“ (Merkliste)':lov?'Weil „'+s.title+'“ ein Lieblingstitel ist':'Weil Dir „'+s.title+'“ gefällt')))});
  await pool(dis.slice(0,10),4,async s=>{(await A.similar(s)).forEach(r=>add(r.it,-0.7*r.w,null))});
  try{(await A.explore(likes.concat(watch),[...cand.values()].filter(c=>c.score>0).map(c=>c.it))).forEach(r=>add(r.it,0.35*r.w,r.why,true))}catch(e){}
  const list=[...cand.values()].filter(c=>c.score>0&&passRules(m,c.it));
  list.forEach(c=>c.rank=c.score+Math.random()*0.25);
  const core=list.filter(c=>!c.ex).sort((a,b)=>b.rank-a.rank),ex=shuffle(list.filter(c=>c.ex));
  const out=[];let i=0,j=0;
  while(i<core.length||j<ex.length){if((out.length%5===4&&j<ex.length)||i>=core.length)out.push(ex[j++]);else out.push(core[i++])}
  return out;
}
function ensurePool(m){
  if(ui.pool[m]||ui.building[m]||ui.err[m])return;
  ui.building[m]=true;
  buildPool(m).then(p=>{ui.pool[m]=p;if(!ui.shown[m])ui.shown[m]=12})
    .catch(e=>{ui.err[m]=e.message||String(e)})
    .finally(()=>{ui.building[m]=false;render()});
}
function resetPools(ms){(ms||ORDER).forEach(m=>{delete ui.pool[m];delete ui.err[m]})}
function visible(m,n){
  const p=sortF(m,(ui.pool[m]||[]).filter(c=>!S.items[c.it.k]&&(ui.med!==m||passF(m,c.it))));
  if(!isFS(m))return {list:p.slice(0,n),more:p.length>n};
  const only=S.settings.onlyMine&&S.settings.providers.length;
  const look=p.slice(0,only?n*3+12:n+4).filter(c=>!AV.has(c.it.k));
  if(look.length)ensureAv(m,look);
  if(!only)return {list:p.slice(0,n),more:p.length>n};
  const ok=p.filter(c=>AV.has(c.it.k)&&avSum(c.it)?.hits.length);
  return {list:ok.slice(0,n),more:ok.length>n||p.some(c=>!AV.has(c.it.k)),pending:look.length>0};
}

const YEARS=[['','Alle Jahre'],['2020','ab 2020'],['2010','2010–2019'],['2000','2000–2009'],['1990','1990–1999'],['0','vor 1990']];

function passF(m,it){const f=flt(m);
  if(f.g&&!(it.genres||[]).includes(f.g))return false;
  if(f.g&&isFS(m)&&it.gids&&it.gids.length){const type=m==='film'?'movie':'tv';const g=(gCache[type]||[]).find(x=>x.name===f.g);if(g){const ex=genreExcl(type,g.id);if(it.gids.some(x=>ex.includes(x)))return false}}
  if(f.y){const y=parseInt(it.year)||0;if(!y)return false;const a=+f.y;if(a===0?y>=1990:a===2020?y<2020:(y<a||y>a+9))return false}
  if(f.r&&!(hasRating(it)&&it.rating>=f.r))return false;return true}
function sortF(m,list){const f=flt(m);

function discoverBlock(m,n){
  if(needsKey(m))return keyPrompt(m);
  /* zuerst die KI-Tipps des Bereichs, danach mit den herkömmlichen Vorschlägen auffüllen */
  const only=isFS(m)&&S.settings.onlyMine&&S.settings.providers.length;
  let A=aiTips(m).filter(x=>ui.med!==m||passF(m,x.it));
  if(isFS(m)){const look=A.map(x=>x.it).filter(i=>!AV.has(i.k));if(look.length)ensureAv(m,look)}
  if(only)A=A.filter(x=>AV.has(x.it.k)&&avSum(x.it)?.hits.length);
  const aiH=A.slice(0,n).map(x=>card(x.it,'discover',[x.why],true)).join('');
  const hasBase=byStatus(m,'like').length||byStatus(m,'watch').length;
  if(!hasBase)return A.length?'<div class="grid">'+aiH+'</div>':emptyBase(m);
  if(A.length>=n&&ui.med!==m)return '<div class="grid">'+aiH+'</div>';
  if(ui.err[m])return (A.length?'<div class="grid">'+aiH+'</div>':'')+'<p class="err">Vorschläge konnten nicht geladen werden: '+esc(ui.err[m])+'</p><button class="btn" data-act="reshuffle" data-m="'+m+'">Erneut versuchen</button>';
  ensurePool(m);
  if(!ui.pool[m])return A.length?'<div class="grid">'+aiH+'</div>'+(A.length<n?skel(Math.min(n-A.length,3)):''):skel(Math.min(n,6));
  const ak=new Set(A.map(x=>x.it.k));
  const rest=Math.max(0,n-A.length);
  const v=visible(m,rest+A.length);
  const fill=v.list.filter(c=>!ak.has(c.it.k)).slice(0,rest);
  const more=A.length>n||v.more||v.list.filter(c=>!ak.has(c.it.k)).length>rest;
  if(!A.length&&!fill.length&&!v.pending&&ui.med===m&&fltActive(m))return '<div class="empty"><p>Nichts passt zu den Filtern.</p><button class="btn" data-act="fltReset" data-m="'+m+'">Filter zurücksetzen</button><button class="btn" data-act="reshuffle" data-m="'+m+'">'+IC.shuffle+'Neue Vorschläge</button></div>';
  if(!A.length&&!fill.length)return v.pending?skel(3):'<div class="empty"><p>'+(isFS(m)&&S.settings.onlyMine?'Nichts bei Deinen Diensten.':'Keine weiteren Vorschläge.')+'</p><button class="btn" data-act="reshuffle" data-m="'+m+'">'+IC.shuffle+'Neue Vorschläge</button></div>';
  return '<div class="grid">'+aiH+fill.map(c=>card(c.it,'discover',c.reasons)).join('')+'</div>'+(more&&ui.med!=='alle'?'<div class="more"><button class="btn" data-act="more" data-m="'+m+'">Mehr anzeigen</button></div>':'');
}

/* gleiche Folge/gleiches Album aus zwei Quellen (z. B. TMDB und TVmaze) nur einmal; verfolgte Einträge haben Vorrang */
function dedupeEv(list){
  const key=e=>{const t=String(e.text||'');const ep=t.match(/S\d+E\d+/);return e.m+'|'+normName(e.src&&e.src.title)+'|'+(ep?ep[0]:normName(t).slice(0,30))+'|'+String(e.date).slice(0,10)};
  const best=new Map();
  list.forEach(e=>{const k=key(e),c=best.get(k);if(!c||(!isFolK(c.src.k)&&isFolK(e.src.k)))best.set(k,e)});
  const keep=new Set(best.values());return list.filter(e=>keep.has(e));
}
function followBox_unused(ev){
  const fol=folList();if(!fol.length)return '';
  const withEv=new Set(ev.map(e=>e.src.k));
  const up=ev.filter(e=>e.up).sort((a,b)=>String(a.date).localeCompare(String(b.date))),past=ev.filter(e=>!e.up);
  let h='<section class="follow-box"><div class="subh">'+IC.play+'Verfolgt · '+fol.length+(fol.length===1?' Serie':' Serien')+'</div>';
  if(past.length||up.length)h+='<div class="rel">'+past.concat(up).map(evRow).join('')+'</div>';
  const none=fol.filter(i=>!withEv.has(i.k));
  if(none.length)h+='<p class="note" style="margin:10px 0 6px">'+(past.length||up.length?'Ohne aktuellen Termin:':'Gerade keine neuen Folgen angekündigt.')+'</p><div class="fol-none">'+none.map(i=>'<span class="pill"><span>'+esc(i.title)+'</span><button data-act="unfollow" data-k="'+esc(i.k)+'" aria-label="'+esc(i.title)+' nicht mehr verfolgen">'+IC.x+'</button></span>').join('')+'</div>';
  return h+'</section>';
}

/* Neuerscheinungen: Ergebnisse erscheinen schrittweise, letzter Stand wird gespeichert.
   Zeitlimit je Eintrag 25 s, gesamt 3 Min.; hängt nichts mehr dauerhaft. */
const RKEY=()=>'fundus.rel.'+MODE;
function relLoad(){try{const o=JSON.parse(localStorage.getItem(RKEY())||'null');if(o&&Array.isArray(o.list))return o}catch(e){}return null}
function relStore(list,at){try{localStorage.setItem(RKEY(),JSON.stringify({at,list:list.map(e=>({...e,src:strip(e.src)}))}))}catch(e){}}
function relSort(list){
  list.forEach(e=>{e.up=String(e.date).length===4?+e.date>new Date().getFullYear():dayDiff(e.date)>0});
  return list.sort((a,b)=>a.up!==b.up?(a.up?-1:1):a.up?String(a.date).localeCompare(String(b.date)):String(b.date).localeCompare(String(a.date)));
}
let relRun=0;
async function checkReleases(opts={}){
  if(ui.rel&&ui.rel.busy)return;
  const run=++relRun;const t0=Date.now();
  const jobs=[];
  for(const m of ['serie','film','musik','game','buch','podcast']){
    const A=adapter(m);if(!A)continue;
    const its=m==='film'?byStatus(m,'watch'):byStatus(m,'like').concat(byStatus(m,'watch'));
    its.forEach(it=>jobs.push({m,A,it}));
  }
  if(concertsOn())byStatus('musik','like').concat(byStatus('musik','watch')).forEach(it=>jobs.push({m:'musik',A:{releases:concertsFor},it}));
  const prev=ui.rel&&!ui.rel.busy?ui.rel.list:(relLoad()||{}).list||[];
  ui.rel={busy:true,list:prev,fresh:[],done:0,total:jobs.length,errors:0,skipped:0,at:ui.rel&&ui.rel.at};render();
  const ev=[],seenId=new Set();let errors=0,skipped=0,done=0,lastPaint=0;
  const paint=(force)=>{if(run!==relRun)return;const now=Date.now();if(!force&&now-lastPaint<700)return;lastPaint=now;
    ui.rel={...ui.rel,fresh:relSort(ev.slice()),done,errors,skipped};if(ui.tab==='neu'){const y=window.scrollY;render();window.scrollTo(0,y)}};
  try{
    await pool(jobs,4,async j=>{
      if(Date.now()-t0>180000){skipped++;done++;return}
      try{(await timeout(j.A.releases(j.it),25000)).forEach(e=>{if(seenId.has(e.id))return;seenId.add(e.id);ev.push({...e,m:j.m,src:j.it})})}catch(err){errors++}
      done++;paint(false);
    });
  }finally{
    if(run===relRun){
      const list=relSort(ev);list.forEach(e=>{e.isNew=!S.seen[e.id];S.seen[e.id]=1});
      S.lastCheck=Date.now();save();relStore(list,S.lastCheck);
      ui.rel={busy:false,list,errors,skipped,at:S.lastCheck};render();
      const fresh=list.filter(e=>e.isNew);
      if(opts.auto&&fresh.length&&'Notification' in window&&Notification.permission==='granted'){
        try{const n=new Notification('Fundus: '+fresh.length+(fresh.length===1?' Neuerscheinung':' Neuerscheinungen'),{body:fresh.slice(0,4).map(e=>e.src.title+' – '+e.label).join('\n'),tag:'fundus-releases'});n.onclick=()=>{window.focus();ui.tab='neu';render()}}catch(e){}
      }
    }
  }
}

/* Streamingdienste */
async function loadProviders(){
  if(MODE==='demo')return Object.values(DP).map(p=>({ids:[p.id],name:p.name,logo:null}));
  const [a,b]=await Promise.all(['movie','tv'].map(t=>tmdb('/watch/providers/'+t,{watch_region:'DE'})));
  const all=new Map();[...(a.results||[]),...(b.results||[])].forEach(p=>{if(!all.has(p.provider_id))all.set(p.provider_id,p)});
  const prio=p=>((p.display_priorities&&p.display_priorities.DE)??p.display_priority??999);
  const groups=new Map();
  [...all.values()].sort((x,y)=>prio(x)-prio(y)).forEach(p=>{
    const b=baseName(p.provider_name);const g=groups.get(b)||{name:b,ids:[],logo:p.logo_path?TMDB_IMG+'w92'+p.logo_path:null};g.ids.push(p.provider_id);groups.set(b,g)});
  /* große deutsche Abo-Dienste zuerst, reine Leih-/Kaufshops ans Ende */
  const MAJOR=['netflix','amazon prime video','disney plus','apple tv','apple tv plus','wow','hbo max','paramount plus','rtl plus','joyn','magentatv','sky go','dazn','crunchyroll','ard mediathek','zdf','arte','mubi','pluto tv','freevee'];
  const SHOP=/store$|amazon video|google play|rakuten|chili|videoload|microsoft|^youtube$|kino on demand|verleihshop/i;
  const rank=g=>{const i=MAJOR.indexOf(g.name.toLowerCase());return i>=0?i:SHOP.test(g.name)?2000+g.p:100+g.p};
  const arr=[...groups.values()];arr.forEach((g,i)=>g.p=i);
  return arr.sort((a,b)=>rank(a)-rank(b));
}

const PER_GENRE=15;
function initPick(m,host){
  const p={m,host,genres:null,order:[],blocks:{},seen:new Set(),q:'',search:null,searchBusy:false,err:''};ui.pick=p;
  const A=adapter(m);
  if(!A){p.err='Für '+MEDIA[m].label+' fehlt der TMDB-Schlüssel.';return p}
  A.genres().then(g=>{if(ui.pick!==p)return;p.genres=g;
    (S.genres[m]||[]).forEach(id=>{const x=g.find(y=>String(y.id)===String(id));if(x)addGenre(p,x.id)});pickUpdate()})
   .catch(e=>{p.err=e.message;pickUpdate()});
  return p;
}
function addGenre(p,gid){if(p.blocks[gid])return;p.order.push(gid);p.blocks[gid]={page:0,buf:[],items:[],busy:false,done:false,err:''};fillGenre(p,gid)}
function removeGenre(p,gid){const b=p.blocks[gid];if(!b)return;b.items.forEach(it=>{p.seen.delete(it.k);if(it.tk)p.seen.delete(it.tk)});delete p.blocks[gid];p.order=p.order.filter(x=>x!==gid)}
async function fillGenre(p,gid){
  const b=p.blocks[gid];if(!b||b.busy)return;b.busy=true;pickUpdate();
  const target=b.items.length+PER_GENRE;let fetches=0;
  try{
    while(b.items.length<target){
      if(!b.buf.length){if(b.done||fetches>=6)break;fetches++;const r=await adapter(p.m).byGenre(gid,++b.page);if(!r||!r.length)b.done=true;else b.buf=r.slice();continue}
      const it=b.buf.shift();if(it&&!p.seen.has(it.k)&&!(it.tk&&p.seen.has(it.tk))){p.seen.add(it.k);if(it.tk)p.seen.add(it.tk);b.items.push(reg(it))}
    }
  }catch(e){b.err=e.message||String(e)}
  b.busy=false;if(ui.pick===p)pickUpdate();
}

async function tnDetail(it){
  const type=it.m==='film'?'movie':'tv';const d=await tmdb('/'+type+'/'+it.id);
  const len=it.m==='film'?d.runtime:((d.episode_run_time||[])[0]||(d.last_episode_to_air&&d.last_episode_to_air.runtime)||0);
  if(!it.rating&&d.vote_average){it.rating=d.vote_average;it.votes=d.vote_count}
  if((!it.genres||!it.genres.length)&&d.genres)it.genres=d.genres.map(g=>g.name);
  return {len,overview:d.overview,backdrop:d.backdrop_path?TMDB_IMG+'w780'+d.backdrop_path:null,seasons:d.number_of_seasons};
}
async function nextTonight(){
  const T=ui.tonight;if(!T||T.busy)return;const run=++T.run;T.busy=true;T.cur=null;T.msg='';renderTonight();
  const o=tnOpts();const types=o.type==='beide'?['film','serie']:[o.type];
  try{
    if(MODE==='live'&&needsKey('film'))throw new Error('TMDB-Schlüssel fehlt');
    await Promise.all(['movie','tv'].map(t=>tmdbGenres(t).catch(()=>{})));
    if(T.run===run)renderTonight();
    for(const m of types)if(!ui.pool[m]&&(byStatus(m,'like').length||byStatus(m,'watch').length)){try{ui.pool[m]=await buildPool(m)}catch(e){}}
    const cands=[];
    for(const m of types){
      byExact(m,'watch').forEach(it=>cands.push({it,w:3,fromWatch:true,why:''}));
      (ui.pool[m]||[]).slice(0,80).forEach((c,i)=>cands.push({it:c.it,w:2-i/60,why:c.reasons[0]||''}));
    }
    const pickW=a=>{const tot=a.reduce((x,c)=>x+Math.max(.1,c.w),0);let r=Math.random()*tot;for(const c of a){r-=Math.max(.1,c.w);if(r<=0)return c}return a[a.length-1]};
    let pool_=cands.filter(c=>!T.seen.has(c.it.k)&&(!S.items[c.it.k]||S.items[c.it.k].status==='watch'));
    const onlyMine=o.mine&&S.settings.providers.length;
    for(let tries=0;tries<30&&pool_.length;tries++){
      if(T.run!==run)return;
      const c=pickW(pool_);pool_=pool_.filter(x=>x!==c);T.seen.add(c.it.k);
      const it=c.it;
      if(o.genre&&it.genres&&it.genres.length&&!it.genres.includes(o.genre))continue;
      if(+o.minR&&hasRating(it)&&it.rating<+o.minR)continue;
      if(onlyMine){await availFetch(it);const s=avSum(it);if(!s||!s.hits.length)continue}
      let d;try{d=await tnDetail(it)}catch(e){continue}
      if(o.genre&&!(it.genres||[]).includes(o.genre))continue;
      if(+o.minR&&!(hasRating(it)&&it.rating>=+o.minR))continue;
      if(+o.max&&it.m==='film'&&(!d.len||d.len>+o.max))continue;
      if(!onlyMine)await availFetch(it);
      T.cur={it,fromWatch:c.fromWatch,why:c.why,overview:d.overview,backdrop:d.backdrop,len:it.m==='film'?fmtMin(d.len):(d.seasons?d.seasons+(d.seasons===1?' Staffel':' Staffeln'):'')+(d.len?' · '+d.len+' Min./Folge':'')};
      break;
    }
    if(!T.cur)T.msg=cands.length?'Nichts Passendes gefunden. Filter lockern, dann „Anderer Vorschlag“.':'Noch keine Basis für Filme oder Serien. Markiere zuerst ein paar Titel als „Gefällt mir“.';
  }catch(e){T.msg='Fehler: '+(e.message||e)}
  if(T.run===run){T.busy=false;renderTonight()}
}

function gsResHtml(){
  const G=ui.gs;if(!G)return '';
  if(G.q.trim().length<2){
    const recent=Object.values(S.items).sort((a,b)=>b.ts-a.ts).slice(0,6);
    return 
      (recent.length?'<div class="subh">Zuletzt bewertet</div><div class="grid">'+recent.map(i=>card(i,'search')).join('')+'</div>':'');
  }
  const ms=G.m==='alle'?gsMedia():[G.m];let h='';let any=false,busy=false;
  ms.forEach(m=>{const r=G.res[m];if(G.busy[m])busy=true;
    if(r&&r.length){any=true;const lim=G.m==='alle'?4:24;
      h+='<section class="sec f-'+m+'"><div class="sec-h"><h3>'+secT(m)+' <span class="st">'+r.length+'</span></h3>'+(G.m==='alle'&&r.length>lim?'<button class="btn ghost" data-act="gsMed" data-m="'+m+'">Alle '+r.length+' →</button>':'')+'</div><div class="grid">'+r.slice(0,lim).map(it=>card(it,'search')).join('')+'</div></section>'}
    else if(G.err[m]&&G.m!=='alle')h+='<p class="err">'+esc(G.err[m])+'</p>';

function gsSearch(){const G=ui.gs;if(!G)return;clearTimeout(gsT);const q=G.q.trim();

  gsT=setTimeout(()=>{const run=++gsRun;G.res={};G.err={};const ms=G.m==='alle'?gsMedia():[G.m];
    ms.forEach(m=>{G.busy[m]=true;const A=adapter(m);if(!A){G.busy[m]=false;return}

const FB_CFG={apiKey:"AIzaSyBKUL_iThk5jhZr7npM5HJjQ-FBopBnO7Q",authDomain:"wanderlust-8b3ba.firebaseapp.com",projectId:"wanderlust-8b3ba",storageBucket:"wanderlust-8b3ba.firebasestorage.app",messagingSenderId:"638626664196",appId:"1:638626664196:web:055e66c3f7757b0a7d0a51"};

const canSync=()=>MODE==='live'&&/^https?:$/.test(location.protocol);
async function fbInit(){
  if(FB)return FB;
  const b='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const [app,auth,fs]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
  const a=app.initializeApp(FB_CFG,'fundus');
  FB={auth:auth.getAuth(a),db:fs.getFirestore(a),A:auth,F:fs};
  auth.onAuthStateChanged(FB.auth,u=>{SYNC.ready=true;onUser(u)});
  return FB;

const userRef=()=>FB.F.doc(FB.db,'artifacts','fundus','users',SYNC.user.uid);
function payload(){return JSON.parse(JSON.stringify({v:2,writer:CLIENT,updatedAt:Date.now(),items:S.items,del:S.del||{},subs:S.subs||{},settings:S.settings,genres:S.genres,seen:S.seen,snap:S.snap,onboarded:!!S.onboarded,lastCheck:S.lastCheck||0,metaTs:S.metaTs||0,wishReq:S.wishReq||null}))}
/* nur eigene Felder schreiben; ai und wish schreibt der KI-Lauf */
const OWN=['v','writer','updatedAt','items','del','subs','settings','genres','seen','snap','onboarded','lastCheck','metaTs','wishReq'];
function mergeRemote(r){
  normItems(r.items);const items={...S.items},del={...(S.del||{})};const lt=k=>Math.max(items[k]?items[k].ts||0:0,del[k]||0);
  Object.entries(r.items||{}).forEach(([k,v])=>{if((v.ts||0)>lt(k)){items[k]=v;delete del[k]}});
  Object.entries(r.del||{}).forEach(([k,t])=>{if(t>lt(k)){delete items[k];del[k]=t}});
  S.items=items;S.del=del;
  const subs={...(S.subs||{})};Object.entries(r.subs||{}).forEach(([k,v])=>{if(!subs[k]||(v.ts||0)>(subs[k].ts||0))subs[k]=v});S.subs=subs;
  if((r.metaTs||0)>(S.metaTs||0)){S.settings={...S.settings,...(r.settings||{})};S.genres=r.genres||S.genres;S.metaTs=r.metaTs}
  S.seen={...(r.seen||{}),...S.seen};S.snap={...(r.snap||{}),...S.snap};
  if(r.ai)S.ai=r.ai;if(r.wish)S.wish=r.wish;if(r.wishReq&&(!S.wishReq||(r.wishReq.ts||0)>(S.wishReq.ts||0)))S.wishReq=r.wishReq;
  S.onboarded=S.onboarded||!!r.onboarded;S.lastCheck=Math.max(S.lastCheck||0,r.lastCheck||0);
  metaSig=JSON.stringify([S.settings,S.genres]);
}
async function onUser(u){
  if(SYNC.unsub){SYNC.unsub();SYNC.unsub=null}
  ui.pushSt=undefined;
  if(!u){SYNC.user=null;SYNC.state='off';renderAcct();if(ui.intro&&ui.intro.i===0)renderIntro();return}
  SYNC.user={uid:u.uid,name:u.displayName||'',email:u.email||'',photo:u.photoURL||''};SYNC.state='sync';renderAcct();
  try{
    const snap=await FB.F.getDoc(userRef());
    if(snap.exists()){mergeRemote(snap.data());localSave();applyTheme();resetPools();AV.clear()}
    await pushNow();ensurePushSub();
    SYNC.unsub=FB.F.onSnapshot(userRef(),s=>{
      if(!s.exists()||s.metadata.hasPendingWrites)return;const d=s.data();if(d.writer===CLIENT)return;
      mergeRemote(d);localSave();applyTheme();resetPools();SYNC.at=Date.now();SYNC.state='ok';
      if(ui.detail)renderDetail();render();
    },e=>{SYNC.state='err';SYNC.err=fbErr(e);renderAcct()});
    if(ui.intro&&S.onboarded){finishIntro();toast('Deine Daten wurden geladen')}else{render();if(ui.intro&&ui.intro.i===0)renderIntro()}
  }catch(e){SYNC.state='err';SYNC.err=fbErr(e);renderAcct()}
}
function fbErr(e){const c=(e&&e.code)||'';
  if(/permission-denied/.test(c))return 'Keine Berechtigung in der Datenbank. Firestore-Regeln für artifacts/fundus/users prüfen.';
  if(/unavailable|network/.test(c))return 'Keine Verbindung. Änderungen werden später übertragen.';
  if(/unauthorized-domain/.test(c))return 'Diese Adresse ist in Firebase nicht freigegeben (Authentication → Autorisierte Domains).';
  if(/operation-not-allowed/.test(c))return 'Google-Anmeldung ist in Firebase nicht aktiviert.';
  if(/popup-blocked/.test(c))return 'Popup wurde blockiert. Bitte Popups für diese Seite erlauben.';
  return (e&&e.message)||'Unbekannter Fehler';}
function scheduleSync(){if(!SYNC.user)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(pushNow,1500)}
async function pushNow(){
  if(!SYNC.user||!FB)return;SYNC.state='sync';renderAcct();
  try{await FB.F.setDoc(userRef(),payload(),{mergeFields:OWN});SYNC.state='ok';SYNC.err='';SYNC.at=Date.now()}catch(e){SYNC.state='err';SYNC.err=fbErr(e)}
  renderAcct();
}
async function login(){
  if(!canSync()){toast('Anmeldung nur in der installierten bzw. online geöffneten App möglich');return}
  try{const fb=await fbInit();await fb.A.signInWithPopup(fb.auth,new fb.A.GoogleAuthProvider())}
  catch(e){if(!/popup-closed|cancelled-popup/.test(e.code||''))toast('Anmeldung fehlgeschlagen: '+fbErr(e))}
}
async function logout(){if(!FB)return;await pushNow();await FB.A.signOut(FB.auth);toast('Abgemeldet. Die Daten bleiben auf diesem Gerät.')}

function acctBtn(){

  const dot=SYNC.state==='err'?'err':SYNC.state==='sync'?'busy':'ok';

  const av=SYNC.user.photo?'<img src="'+esc(SYNC.user.photo)+'" alt="" referrerpolicy="no-referrer">':'<span>'+esc((SYNC.user.name||SYNC.user.email||'?').slice(0,1).toUpperCase())+'</span>';

/* ---------- Installation als App ---------- */
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(ui.tab==='einstellungen')render()});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('Fundus ist installiert');render()});
/* Handy: Leiste unten direkt in <body>, nicht im mitlaufenden Kopf (Chrome auf Android blendet sie sonst beim Scrollen aus) */
function placeNav(){const n=$('#tabs');if(!n)return;const mob=matchMedia('(max-width:899px)').matches;
  if(mob&&n.parentElement!==document.body)document.body.appendChild(n);
  else if(!mob&&n.parentElement===document.body)$('.top .wrap').appendChild(n)}
placeNav();try{matchMedia('(max-width:899px)').addEventListener('change',placeNav)}catch(e){}
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;
function installSteps(){const u=navigator.userAgent;
  if(/iPhone|iPad|iPod/.test(u))return '<p><b>iPhone/iPad (Safari):</b> unten auf das Teilen-Symbol tippen → „Zum Home-Bildschirm“ → „Hinzufügen“.</p>';
  if(/SamsungBrowser/.test(u))return '<p><b>Samsung Internet:</b> Menü (☰) → „Seite hinzufügen zu“ → „Startbildschirm“.</p>';
  if(/Firefox/.test(u))return '<p><b>Firefox:</b> Menü (⋮) → „Installieren“ bzw. „Zum Startbildschirm hinzufügen“.</p>';
  if(/Android/.test(u))return '<p><b>Chrome (Android):</b> Menü (⋮) oben rechts → „App installieren“ bzw. „Zum Startbildschirm hinzufügen“. Fehlt der Eintrag, ist Fundus evtl. schon installiert: auf dem Startbildschirm nachsehen.</p>';
  return '<p><b>Chrome/Edge (PC):</b> In der Adressleiste rechts auf das Installieren-Symbol klicken, oder Menü (⋮) → „Streamen, speichern und teilen“ → „Seite als App installieren“.</p>';
}
function installPanel(){
  if(isStandalone())return '<p class="ok" style="margin:0">Läuft als App.</p>';
  if(!/^https?:$/.test(location.protocol)||MODE==='demo')return '<p>Nur online möglich.</p>';
  return '<button class="btn pri" data-act="install">Als App installieren</button>'+(ui.instHelp?'<div class="insthelp">'+installSteps()+'</div>':'');
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ---------- Push-Mitteilungen ----------
   Abo je Gerät wird mit dem Konto synchronisiert (S.subs). Ein täglicher Job
   auf GitHub Actions liest die Konten und schickt Neuerscheinungen als Push. */
const VAPID_PUBLIC='BPbXST0UBvG6REMA1frrvW3xPKhxm8r5XFh-T9igYiEcuAnLQ7wI8NXYET8YRMFgVbx-RCIL_LgL5L04tSw43fI';
const b64u=s=>{const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))};
const subKey=ep=>String(ep).replace(/[^a-zA-Z0-9]/g,'').slice(-32);
const deviceName=()=>{const u=navigator.userAgent;return (/Android/.test(u)?'Android':/iPhone|iPad|iPod/.test(u)?'iPhone/iPad':/Windows/.test(u)?'Windows':/Macintosh/.test(u)?'Mac':/Linux/.test(u)?'Linux':'Browser')+(isStandalone()?' (App)':' (Browser)')};
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&/^https?:$/.test(location.protocol);
/* aktiv nur, wenn das Gerät abonniert ist UND im Konto steht (sonst kann der tägliche Job nichts senden) */
async function pushStateNow(){if(!pushSupported())return 'unsupported';try{const reg=await navigator.serviceWorker.getRegistration();const sub=reg&&await reg.pushManager.getSubscription();
  if(!sub)return 'off';const e=(S.subs||{})[subKey(sub.endpoint)];return e&&!e.off?'on':'off'}catch(e){return 'off'}}
/* Selbstheilung: erlaubtes, aber nicht (mehr) im Konto eingetragenes Abo wieder eintragen; als ungültig markiertes erneuern */
async function ensurePushSub(){
  try{
    if(!SYNC.user||!pushSupported()||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
    S.subs=S.subs||{};
    if(sub&&S.subs[subKey(sub.endpoint)]&&S.subs[subKey(sub.endpoint)].off){await sub.unsubscribe();sub=null}
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const j=sub.toJSON(),k=subKey(j.endpoint),c=S.subs[k];
    if(!c||c.off||!c.keys||c.keys.auth!==j.keys.auth){S.subs[k]={endpoint:j.endpoint,keys:j.keys,device:deviceName(),ts:Date.now()};save();await pushNow();ui.pushSt=undefined}
  }catch(e){}
}
async function pushOn(){
  if(!SYNC.user){toast('Bitte zuerst mit Google anmelden');return}
  try{
    const perm=await Notification.requestPermission();if(perm!=='granted'){toast('Mitteilungen wurden nicht erlaubt');ui.pushSt=undefined;render();return}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    const j=sub.toJSON();S.subs=S.subs||{};S.subs[subKey(j.endpoint)]={endpoint:j.endpoint,keys:j.keys,device:deviceName(),ts:Date.now()};
    save();await pushNow();
    reg.showNotification('Fundus',{body:'Push aktiv.',icon:'icon-192.png',badge:'icon-192.png',tag:'fundus-test'});
    ui.pushSt='on';render();
  }catch(e){toast('Push nicht möglich: '+(e.message||e));ui.pushSt=undefined;render()}
}
async function pushOff(){
  try{const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(sub){const k=subKey(sub.endpoint);await sub.unsubscribe();if(S.subs&&S.subs[k]){S.subs[k]={...S.subs[k],off:true,ts:Date.now()};save()}}}catch(e){}
  ui.pushSt='off';render();
}
function pushPanel(){
  if(!pushSupported())return '<p>Nur in der installierten App.</p>';
  if(ui.pushSt===undefined){ui.pushSt='…';pushStateNow().then(s=>{ui.pushSt=s;if(ui.tab==='einstellungen')render()})}
  const devs=Object.values(S.subs||{}).filter(s=>!s.off);
  let h='<p>Täglich ca. 8 Uhr: Neues zu Merkliste und Favoriten.</p>';
  if(!SYNC.user)return h+'<p class="note" style="margin:0">Anmeldung nötig.</p>';
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!isStandalone())return h+'<p class="note" style="margin:0">Erst zum Home-Bildschirm hinzufügen.</p>';
  h+=ui.pushSt==='on'?'<p class="ok" style="margin:0 0 10px">Aktiv auf diesem Gerät</p><button class="btn" data-act="pushOff">Ausschalten</button>'
    :Notification.permission==='denied'?'<p class="err" style="margin:0">Im Browser blockiert.</p>'
    :'<button class="btn pri" data-act="pushOn">'+IC.bell+'Aktivieren</button>';
  h+='<div style="margin-top:12px"><label class="switch"><input type="checkbox" id="sw-digest" data-set="digest"'+(S.settings.digest!==false?' checked':'')+'> Wochen-Digest (sonntags)</label></div>';
  if(devs.length)h+='<p class="note" style="margin:10px 0 0">Geräte: '+devs.map(d=>esc(d.device||'Gerät')).join(', ')+'</p>';
  return h;
}

/* ---------- Tagesrhythmus ----------
   Vorschläge: Antworten der Dienste gelten 24 h, danach wird neu abgefragt.
   Neuerscheinungen (Merkliste + „Gefällt mir“): automatisch einmal täglich,
   beim Öffnen der App und stündlich geprüft, solange sie geöffnet ist. */
const DAY=24*H;
function dailyCheck(){
  if(MODE!=='live'||!S.onboarded||S.settings.autoCheck===false||ui.intro)return;
  if(Date.now()-(S.lastCheck||0)<DAY-30*60e3)return;
  if(!Object.values(S.items).some(x=>x.status==='like'||x.status==='love'||x.status==='watch'))return;
  setTimeout(()=>checkReleases({auto:true}),1500);
}
const fmtDT=t=>t?new Date(t).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'noch nie';
function updBox(){
  const st=S.settings;const nxt=S.lastCheck?S.lastCheck+DAY:0;
  const nperm='Notification' in window?Notification.permission:'unsupported';
  return 
    '<div class="opts"><label class="switch"><input type="checkbox" id="sw-auto" data-set="autoCheck"'+(st.autoCheck!==false?' checked':'')+'> Täglich automatisch prüfen</label>'+
    '<p class="note" style="margin:0">Letzte Prüfung: '+fmtDT(S.lastCheck)+(nxt&&st.autoCheck!==false?' · nächste ab '+fmtDT(nxt):'')+'</p>'+
    (nperm==='default'?'<div><button class="btn" data-act="notifAsk">'+IC.bell+'Browser-Hinweise erlauben</button></div>':nperm==='granted'?'<p class="ok" style="margin:0">Browser-Hinweise erlaubt</p>':nperm==='denied'?'<p class="note" style="margin:0">Browser-Hinweise blockiert</p>':'')+
    '</div>';
}

function demoSeed(){
  const s=newState();s.onboarded=true;s.settings.providers=[8,9,337];
  s.genres={film:['Science-Fiction','Thriller'],serie:['Science-Fiction','Krimi'],musik:['Black Metal','Post-Rock'],buch:['Fantasy','Science-Fiction'],podcast:['True Crime','Geschichte']};
  const put=(m,id,st)=>{const it=DEMO_CAT[m].find(x=>x.id===id);s.items[it.k]={...strip(it),status:st,ts:Date.now()-Math.random()*1e6}};
  [['film','f1'],['film','f6'],['serie','s1'],['serie','s2'],['serie','s5'],['musik','m1'],['musik','m5'],['musik','m14'],['buch','b1'],['buch','b6'],['podcast','p1'],['podcast','p3']].forEach(([m,id])=>put(m,id,'like'));
  [['film','f4'],['serie','s3'],['musik','m6']].forEach(([m,id])=>put(m,id,'watch'));
  put('film','f16','dislike');
  return s;
}
const SPLASH_T0=performance.now();
function hideSplash(){const el=$('#splash');if(!el||el.dataset.out)return;el.dataset.out='1';
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),500)},Math.max(0,1400-(performance.now()-SPLASH_T0)))}
setTimeout(hideSplash,3000);
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#splash'))hideSplash()});
async function start(){
  let live=false;
  /* Live, sobald irgendeine Datenquelle antwortet */
  const probe=u=>fetch(u,{mode:'no-cors',cache:'no-store'}).then(()=>true);
  try{live=await timeout(Promise.any(['https://api.themoviedb.org/3/configuration','https://openlibrary.org/search.json?q=a&limit=1&fields=key','https://api.tvmaze.com/shows/1'].map(probe)),6000)}catch(e){live=false}
  MODE=live?'live':'demo';
  const th=S.settings.theme;
  S=loadState()||newState();
  S.del=S.del||{};metaSig=JSON.stringify([S.settings,S.genres]);
  if(canSync())fbInit().catch(()=>{SYNC.ready=true;SYNC.err='Anmeldedienst nicht erreichbar';renderAcct();if(ui.intro&&ui.intro.i===0)renderIntro()});
  if(!loadState())S.settings.theme=th;
  applyTheme();render();
  if(location.hash==='#neu'&&S.onboarded)ui.tab='neu';
  if(location.hash==='#suchen'&&S.onboarded)ui.tab='suchen';
  if(location.hash==='#entdecken'&&S.onboarded){ui.tab='entdecken';ui.med='alle'}
  try{history.replaceState({tab:ui.tab,med:ui.med},'')}catch(e){}
  if(!S.onboarded)startIntro();
  hideSplash();dailyCheck();setInterval(dailyCheck,36e5);
}
S=newState();
try{const t=localStorage.getItem('fundus.theme');if(t)S.settings.theme=t}catch(e){}
applyTheme();render();$('#view').innerHTML=skel(6);
start();
})();
